name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".trivyignore"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".trivyignore"
      - ".github/workflows/backend-ci.yml"

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Test
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest

      - name: Build Docker image
        run: docker build -t mainplatform-backend:${{ github.sha }} ./backend

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mainplatform-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          pkg-types: os,library
          severity: CRITICAL,HIGH

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: mainplatform-backend:${{ github.sha }}
          format: cyclonedx
          output: backend-sbom.cdx.json
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom-${{ github.sha }}
          path: backend-sbom.cdx.json
          retention-days: 30

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        id: push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME=ghcr.io/$OWNER/mainplatform-backend
          docker tag mainplatform-backend:${{ github.sha }} "$IMAGE_NAME:${{ github.sha }}"
          docker tag mainplatform-backend:${{ github.sha }} "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

          DIGEST=$(docker buildx imagetools inspect "$IMAGE_NAME:${{ github.sha }}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: backend-sbom.cdx.json
          push-to-registry: true
