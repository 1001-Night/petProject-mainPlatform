---
- name: Copy Vault Secrets Operator values
  ansible.builtin.copy:
    src: vault-secrets-operator-values.yaml
    dest: /tmp/vault-secrets-operator-values.yaml
    mode: "0644"

- name: Download Vault Secrets Operator Helm chart source
  ansible.builtin.get_url:
    url: >-
      https://github.com/hashicorp/vault-secrets-operator/archive/refs/tags/v{{ vault_secrets_operator_chart_version }}.tar.gz
    dest: >-
      /tmp/vault-secrets-operator-{{ vault_secrets_operator_chart_version }}.tar.gz
    mode: "0644"

- name: Extract Vault Secrets Operator Helm chart source
  ansible.builtin.unarchive:
    src: >-
      /tmp/vault-secrets-operator-{{ vault_secrets_operator_chart_version }}.tar.gz
    dest: /tmp
    remote_src: true
    creates: >-
      /tmp/vault-secrets-operator-{{ vault_secrets_operator_chart_version }}/chart/Chart.yaml

- name: Install or upgrade Vault Secrets Operator
  kubernetes.core.helm:
    binary_path: /usr/local/bin/helm
    kubeconfig: /etc/kubernetes/admin.conf
    release_name: vault-secrets-operator
    chart_ref: >-
      /tmp/vault-secrets-operator-{{ vault_secrets_operator_chart_version }}/chart
    release_namespace: vault-secrets-operator-system
    create_namespace: true
    values_files:
      - /tmp/vault-secrets-operator-values.yaml
    reset_values: true
    state: present
    wait: true
    atomic: true
    timeout: 5m0s
    history_max: 5
