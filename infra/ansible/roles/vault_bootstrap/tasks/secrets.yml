---
- name: Define desired Vault secrets
  ansible.builtin.set_fact:
    vault_desired_secrets:
      - path: "{{ vault_kv_mount }}/data/mainplatform/database"
        data:
          POSTGRES_PASSWORD: "{{ mainplatform_postgres_password }}"
          DATABASE_URL: >-
            postgresql+psycopg://app:{{ mainplatform_postgres_password }}@postgres:5432/app
      - path: "{{ vault_kv_mount }}/data/monitoring/grafana"
        data:
          admin-user: admin
          admin-password: "{{ grafana_admin_password }}"
      - path: "{{ vault_kv_mount }}/data/monitoring/telegram"
        data:
          bot-token: "{{ telegram_bot_token }}"
  no_log: true

- name: Read current Vault secrets
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ vault_kubeconfig }}"
      - exec
      - --stdin
      - --namespace
      - "{{ vault_namespace }}"
      - "{{ vault_pod }}"
      - --
      - sh
      - -ec
      - |
        IFS= read -r VAULT_TOKEN
        export VAULT_TOKEN
        vault read -format=json "$1"
      - vault-secret-read
      - "{{ item.path }}"
    stdin: "{{ vault_root_token }}"
    stdin_add_newline: true
  loop: "{{ vault_desired_secrets }}"
  register: vault_current_secrets
  changed_when: false
  failed_when: vault_current_secrets.rc not in [0, 2]
  no_log: true

- name: Write Vault secrets
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ vault_kubeconfig }}"
      - exec
      - --stdin
      - --namespace
      - "{{ vault_namespace }}"
      - "{{ vault_pod }}"
      - --
      - sh
      - -ec
      - |
        IFS= read -r VAULT_TOKEN
        export VAULT_TOKEN
        vault write "$1" -
      - vault-secret-write
      - "{{ item.item.path }}"
    stdin: |-
      {{ vault_root_token }}
      {{ {'data': item.item.data} | to_json }}
    stdin_add_newline: true
  loop: "{{ vault_current_secrets.results }}"
  when: >-
    item.rc != 0 or
    (item.stdout | from_json).data.data != item.item.data
  changed_when: true
  no_log: true
