apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mainplatform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-requests-cpu: "10m"
        vault.hashicorp.com/role: mainplatform-backend
        vault.hashicorp.com/agent-inject-secret-database-url: >-
          secret/data/mainplatform/database
        vault.hashicorp.com/agent-inject-perms-database-url: "0444"
        vault.hashicorp.com/agent-inject-template-database-url: |
          {{- with secret "secret/data/mainplatform/database" -}}
          {{ .Data.data.DATABASE_URL }}
          {{- end }}
    spec:
      serviceAccountName: mainplatform-backend
      containers:
        - name: backend
          image: ghcr.io/1001-night/mainplatform-backend:0a797b8e1daf3c495b454d81402d0a8e9eda4d60
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mainplatform-config
          env:
            - name: DATABASE_URL_FILE
              value: /vault/secrets/database-url
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mainplatform
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
