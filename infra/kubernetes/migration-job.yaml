apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrations
  namespace: mainplatform
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: backend-migrations
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-requests-cpu: "25m"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: mainplatform-backend
        vault.hashicorp.com/agent-inject-secret-database-url: >-
          secret/data/mainplatform/database
        vault.hashicorp.com/agent-inject-perms-database-url: "0444"
        vault.hashicorp.com/agent-inject-template-database-url: |
          {{- with secret "secret/data/mainplatform/database" -}}
          {{ .Data.data.DATABASE_URL }}
          {{- end }}
    spec:
      serviceAccountName: mainplatform-backend
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/1001-night/mainplatform-backend@sha256:fc740ffb8e33ad098fd13fb2af564032a9148feb710a5f01170076da7f986570
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 10001
          command:
            - sh
            - -c
            - alembic upgrade head
          envFrom:
            - configMapRef:
                name: mainplatform-config
          env:
            - name: DATABASE_URL_FILE
              value: /vault/secrets/database-url
