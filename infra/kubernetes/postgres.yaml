apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mainplatform
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-requests-cpu: "25m"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: mainplatform-postgres
        vault.hashicorp.com/agent-inject-secret-postgres-password: >-
          secret/data/mainplatform/database
        vault.hashicorp.com/agent-inject-perms-postgres-password: "0444"
        vault.hashicorp.com/agent-inject-template-postgres-password: |
          {{- with secret "secret/data/mainplatform/database" -}}
          {{ .Data.data.POSTGRES_PASSWORD }}
          {{- end }}
    spec:
      serviceAccountName: mainplatform-postgres
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: postgres-volume-setup
          image: postgres:16-alpine
          command:
            - sh
            - -ec
            - |
              mkdir -p /data/pgdata /run/postgresql
              chmod 0700 /data/pgdata
              chmod 03775 /run/postgresql
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 70
          volumeMounts:
            - name: postgres-data
              mountPath: /data
            - name: postgres-run
              mountPath: /run
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsUser: 70
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: mainplatform-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: mainplatform-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD_FILE
              value: /vault/secrets/postgres-password
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - app
                - -d
                - app
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - app
                - -d
                - app
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: postgres-run
              mountPath: /var/run/postgresql
              subPath: postgresql
            - name: postgres-tmp
              mountPath: /tmp
      volumes:
        - name: postgres-run
          emptyDir: {}
        - name: postgres-tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mainplatform
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
