apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mainplatform
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-requests-cpu: "25m"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/role: mainplatform-postgres
        vault.hashicorp.com/agent-inject-secret-postgres-password: >-
          secret/data/mainplatform/database
        vault.hashicorp.com/agent-inject-perms-postgres-password: "0444"
        vault.hashicorp.com/agent-inject-template-postgres-password: |
          {{- with secret "secret/data/mainplatform/database" -}}
          {{ .Data.data.POSTGRES_PASSWORD }}
          {{- end }}
    spec:
      serviceAccountName: mainplatform-postgres
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: mainplatform-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: mainplatform-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD_FILE
              value: /vault/secrets/postgres-password
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - app
                - -d
                - app
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - app
                - -d
                - app
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        storageClassName: local-path
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mainplatform
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
